name: Reminders Cron

on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch: {}

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        env:
          REMINDER_URL: ${{ secrets.REMINDER_URL }}
          CRON_SERVICE_SECRET: ${{ secrets.CRON_SERVICE_SECRET }}
        run: |
          if [ -z "$REMINDER_URL" ] || [ -z "$CRON_SERVICE_SECRET" ]; then
            echo "Missing REMINDER_URL or CRON_SERVICE_SECRET secrets"
            exit 1
          fi
          curl -sS -X POST "$REMINDER_URL" \
            -H "x-cron-secret: $CRON_SERVICE_SECRET" \
            -H "content-type: application/json"
