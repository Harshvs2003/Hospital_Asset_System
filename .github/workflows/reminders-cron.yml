name: Reminders Cron

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch: {}

jobs:
  run-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders
        env:
          CRON_SERVICE_SECRET: ${{ secrets.CRON_SERVICE_SECRET }}
        run: |
          if [ -z "$CRON_SERVICE_SECRET" ]; then
            echo "Missing CRON_SERVICE_SECRET secret"
            exit 1
          fi
          curl -f -sS -X POST "https://api.assetops.in/api/cron/reminders" \
            -H "x-cron-secret: $CRON_SERVICE_SECRET" \
            -H "content-type: application/json"
